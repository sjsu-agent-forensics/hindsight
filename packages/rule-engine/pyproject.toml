[project]
name = "rule-engine"
version = "0.1.0"
description = "Deterministic rule evaluation and trace replay, shared by the interposer and the analysis service"
readme = "README.md"
authors = [
    { name = "ConlynPattison", email = "conlynrp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "provenance",
    "trace-schema",
]

[tool.uv.sources]
provenance = { workspace = true }
trace-schema = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
