[project]
name = "hindsight-server-kit"
version = "0.1.0"
description = "Session handling, control endpoint and effect log shared by the internal MCP tool servers"
readme = "README.md"
requires-python = ">=3.12"
# The servers that import this kit need mcp 2.x, so it must never depend on hindsight-core (mcp<2)
# -- see "The MCP server exception" in the root README.md. starlette, uvicorn and httpx2 also come
# in with fastmcp, but the kit imports them directly, so it declares them itself.
dependencies = [
    "fastmcp>=4.0.8",
    "httpx2>=2.15.1",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
