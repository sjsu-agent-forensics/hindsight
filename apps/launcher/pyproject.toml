[project]
name = "launcher"
version = "0.1.0"
description = "Runs the agent under a hindsight session registered with the interposer"
readme = "README.md"
authors = [
    { name = "ConlynPattison", email = "conlynrp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "trace-schema",
]

[project.scripts]
launcher = "launcher.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
trace-schema = { workspace = true }
