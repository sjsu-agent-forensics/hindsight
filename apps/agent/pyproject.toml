[project]
name = "agent"
version = "0.1.0"
description = "LangGraph ReAct agent that reaches all of its tools through the interposer"
readme = "README.md"
authors = [
    { name = "ConlynPattison", email = "conlynrp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hindsight-core",
    "langchain>=1.4.2",
    "langchain-core>=1.6.9",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "trace-schema",
]

[project.scripts]
agent = "agent.main:main"

[tool.uv.sources]
hindsight-core = { workspace = true }
trace-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
