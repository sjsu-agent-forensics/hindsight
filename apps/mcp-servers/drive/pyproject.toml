[project]
name = "drive-server"
version = "0.1.0"
description = "Internal MCP tool server for a cloud drive of seeded workspace files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.8",
    "hindsight-server-kit",
]

[project.scripts]
drive-server = "drive_server.main:main"

[tool.uv.sources]
hindsight-server-kit = { path = "../../../packages/hindsight-server-kit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
