[project]
name = "hindsight"
version = "0.1.0"
description = "Post-execution forensics framework for compromised LLM-based agent systems"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*", "demos/*"]
# MCP servers need mcp 2.x (fastmcp 4); the rest of the workspace is pinned to mcp 1.x
# by langchain-mcp-adapters. Each server is its own project with its own .venv -- see the README.
exclude = ["apps/mcp-servers/*"]

[tool.uv]
package = false

[tool.docformatter]
black = true
recursive = true
exclude = [".venv"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "docformatter>=1.7.8",
]
